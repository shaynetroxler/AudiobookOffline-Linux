name: AppImage

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: bash build-aux/appimage/run-docker-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AudiobookOffline-x86_64.AppImage
          path: dist/AudiobookOffline-x86_64.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudiobookOffline-x86_64.AppImage
